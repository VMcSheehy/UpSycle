name: Deploy to App Runner

# Push to main: lint, typecheck, and build first, then deploy. AWS account
# and region come from GitHub Actions variables (AWS_ACCOUNT_ID, AWS_REGION),
# not from a hardcoded account. The OIDC role only exists in that account.
# See infra/lib/stacks/cicd-stack.ts. Default repo for the role trust policy
# is VMcSheehy/UpSycle (infra/bin/infra.ts).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/upsycle?schema=public
          SITE_URL: https://upsyclemarket.com

  deploy:
    name: Migrate and deploy
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/UpSycle-GitHubActionsDeployRole
          aws-region: ${{ vars.AWS_REGION || 'us-west-2' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set. A private database cannot be reached from this runner."
            echo "The App Runner container runs prisma migrate deploy on startup."
            exit 0
          fi
          npx prisma migrate deploy

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      # Network, data, the app, and the weekly lottery. Auth and storage
      # deploy with App Runner because it depends on them. DnsStack and
      # EmailStack stay out of this job: the domain cutover and SES
      # production access are owner steps. After CicdStack exists, run
      # infra/scripts/bootstrap-account.sh once so the CDK execution role
      # drops AdministratorAccess.
      - name: cdk deploy
        working-directory: infra
        run: npx cdk deploy UpSycle-NetworkStack UpSycle-DataStack UpSycle-AppRunnerStack UpSycle-PlacementStack --require-approval never
